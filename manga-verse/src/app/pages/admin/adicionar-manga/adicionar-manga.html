
<div class="pagina-adicionar">

  <div class="card-adicionar">

    <h1>{{ idEdicao ? 'Alterar mangá' : 'Adicionar novo mangá' }}</h1>

    <p>Preencha as informações do produto.</p>

    <form (ngSubmit)="cadastrarManga()">

      <label>Nome do mangá</label>
      <input
        type="text"
        name="nome"
        [(ngModel)]="nome"
        placeholder="Ex: One Piece"
        required>

      <label>Autor</label>
      <input
        type="text"
        name="autor"
        [(ngModel)]="autor"
        placeholder="Nome do autor"
        required>

      <label>Gênero</label>
      <select
        name="genero"
        [(ngModel)]="genero"
        required>

        <option value="" disabled>Selecione um gênero</option>
        <option value="Ação">Ação</option>
        <option value="Aventura">Aventura</option>
        <option value="Romance">Romance</option>
        <option value="Fantasia">Fantasia</option>
        <option value="Sobrenatural">Sobrenatural</option>
        <option value="Comédia">Comédia</option>
        <option value="Drama">Drama</option>

      </select>

      <label>Preço (R$)</label>
      <input
        type="number"
        name="preco"
        [(ngModel)]="preco"
        min="0.01"
        step="0.01"
        placeholder="39.90"
        required>

      <label>Imagem da capa (URL)</label>
      <input
        type="url"
        name="imagem"
        [(ngModel)]="imagem"
        placeholder="https://..."
        required>

      <label>Descrição</label>
      <textarea
        name="descricao"
        [(ngModel)]="descricao"
        placeholder="Descreva a história do mangá"
        required>
      </textarea>

      <label>Quantidade em estoque</label>
      <input
        type="number"
        name="estoque"
        [(ngModel)]="estoque"
        min="0"
        step="1"
        placeholder="10"
        required>

      <label><input type="checkbox" name="destaque" [(ngModel)]="destaque"> Exibir na vitrine</label>

      <p *ngIf="mensagem" class="mensagem">
        {{ mensagem }}
      </p>

      <button type="submit">
        Cadastrar mangá
      </button>

      <a routerLink="/admin">
        Voltar ao painel
      </a>

    </form>

  </div>

</div>
